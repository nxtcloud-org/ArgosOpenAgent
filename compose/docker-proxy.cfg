# ArgosOpen Agent — Docker API 읽기 전용 프록시 (Docker 공식 haproxy 이미지)
#
# 이 파일이 유일한 정답(single source of truth)이다. init 이 그대로 복사한다.
#
# ── 왜 필요한가 ──
# Alloy 는 cAdvisor(컨테이너 메트릭)와 컨테이너 로그 수집에 Docker API 가 필요하다.
# 그런데 docker.sock 을 직접 마운트하면 ":ro" 를 붙여도 API 는 전부 쓸 수 있다(":ro" 는 소켓 파일을
# 못 지우게 할 뿐이다). 그래서 Alloy 가 뚫리면 "docker run -v /:/host --privileged" 한 줄로 곧 호스트 root 였다.
# 이 프록시가 소켓을 대신 잡고, Alloy 에는 아래 조회 경로만 열어 준다. 컨테이너 생성·exec·삭제·
# 파일 꺼내기(archive/export) 같은 요청은 403 으로 막힌다.
#
# ── 허용 목록 ──
# Alloy v1.18.0 이 실제로 부르는 경로만 넣었다(dind 에서 전 요청을 기록해 확인, 2026-11-09).
#   HEAD /_ping, GET /version, /info, /networks, /containers/json,
#   GET /containers/<id>/json, /containers/<id>/logs
# Alloy 를 올린 뒤 컨테이너 메트릭·로그가 비면 막힌 요청부터 본다:
#   docker logs argos-docker-proxy    (막힌 요청만 남는다)

global
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  # 거부(403)·실패만 남긴다. 정상 조회까지 남기면 15초마다 수십 줄이 쌓인다.
  option dontlog-normal
  timeout connect 5s
  # 컨테이너 로그는 follow 로 계속 열어 두는 연결이라 짧게 잡으면 끊겼다 다시 붙는다
  timeout client 1h
  timeout server 1h

frontend docker
  bind :2375
  acl read_method method GET HEAD
  acl allowed_path path -m reg ^(/v[0-9.]+)?/(_ping|version|info|networks|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs))$
  http-request deny deny_status 403 unless read_method allowed_path
  default_backend sock

backend sock
  server docker /var/run/docker.sock
