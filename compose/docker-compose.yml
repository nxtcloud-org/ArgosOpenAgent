# ArgosOpen Agent — Alloy 모니터링 에이전트
#
# ── 이미지 버전 고정 (2026-08-16 기준 최신 정식 릴리스) ──
# latest 를 쓰면 노드마다 다른 버전이 깔린다. 오늘 A노드, 2주 뒤 B노드에 설치하면
# Alloy 버전이 달라져 수집 항목·라벨이 미묘하게 어긋날 수 있다.
# 업그레이드는 이 파일을 고쳐 명시적인 커밋으로 남긴다.
#
# 이 파일이 유일한 정답(single source of truth)이다. init 이 이 파일을 그대로
# 복사해 설치 경로에 놓는다 — 스크립트 안에 사본을 만들지 않는다.
# 컨테이너 구성을 바꾸려면 여기만 고치면 된다.
#
# 런타임 값(MIMIR_ENDPOINT/LOKI_ENDPOINT/INSTANCE_ID/NODE_NAME)은 같은 디렉토리의
# .env 에서 주입된다. 설정 파일 자체는 모든 노드에서 동일하게 유지한다.
services:
  alloy:
    image: grafana/alloy:v1.18.0
    container_name: argos-alloy
    restart: unless-stopped
    # cAdvisor가 "다른" 컨테이너의 cgroup을 보려면 호스트 cgroup 네임스페이스가 필요하다.
    # cgroup v2(AL2023 등)에서 Docker 기본값은 cgroupns=private이라, 이 설정이 없으면
    # Alloy는 자기 자신의 cgroup만 보게 되어 컨테이너 메트릭이 전부 비어 나온다.
    cgroup: host
    devices:
      - /dev/kmsg:/dev/kmsg
    # 파일 로그 수집(LOG_DIRS)의 첫 읽기 위치를 정한 뒤 alloy 를 실행한다(alloy-start.sh 머리 주석).
    # 파일 로그를 안 쓰면 그대로 alloy 만 실행한다.
    # 아래 command 는 그대로 alloy 인자로 넘어간다.
    entrypoint: ["/bin/bash", "/etc/alloy/alloy-start.sh"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      MIMIR_ENDPOINT: ${MIMIR_ENDPOINT}
      LOKI_ENDPOINT: ${LOKI_ENDPOINT}
      INSTANCE_ID: ${INSTANCE_ID}
      NODE_NAME: ${NODE_NAME}
    # Alloy UI·디버그(/debug/pprof 등) 포트. 인증이 없어 외부에 열지 않는다 — 이 노드 안에서만 접속.
    # 수집 데이터는 이 포트가 아니라 Alloy 가 중앙으로 push 한다(9009·3100 아웃바운드).
    ports: ["127.0.0.1:12345:12345"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy-start.sh:/etc/alloy/alloy-start.sh:ro
      - alloy-data:/var/lib/alloy/data
      # 메트릭: 호스트 OS
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # 메트릭: node_exporter diskstats 의 udev 장치 메타데이터 (없으면 error 로그)
      - /run/udev:/run/udev:ro
      # 도커 API 는 소켓을 직접 받지 않고 docker-proxy(읽기 전용)를 거친다 — docker-proxy.cfg 머리 주석
      # 메트릭(cadvisor): node_exporter와 달리 아래는 "기본 경로 그대로" 읽는다.
      # 빠지면 컨테이너 메트릭이 전부 비어 나온다.
      # (/rootfs 는 config.alloy 의 rootfs_path 로도 쓰인다 — 디스크 사용량 정확도)
      - /:/rootfs:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # 로그: 파일 로그(LOG_DIRS)는 여기서 읽지 않는다. 별도 컨테이너 argos-alloy-files 가 읽는다
      #       (docker-compose.files.yml). 이 컨테이너는 / 전체가 보여서 링크로 root 파일이 새기 때문.
      # 로그: systemd journald (시스템/서비스 로그)
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/12345"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # healthcheck 실패 시 호스트의 argos-autoheal 타이머가 재시작한다(host/argos-autoheal)
    labels:
      - "autoheal=true"
    depends_on: [docker-proxy]
    networks: [argos, dockerapi]

  # Docker API 읽기 전용 프록시 — Alloy 가 docker.sock 을 직접 잡지 않게 한다(docker-proxy.cfg 머리 주석).
  # Docker 공식 이미지(haproxy 3.2 LTS). 소켓은 root 소유라 root 로 돌지만 권한(capability)은 전부 뺐고,
  # 외부와 닿지 않는 내부 네트워크(dockerapi)에 Alloy 하고만 붙어 있다. 파일 로그 컨테이너는 이 망에 없다.
  docker-proxy:
    image: haproxy:3.2.26-alpine
    container_name: argos-docker-proxy
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - ./docker-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dockerapi]

volumes:
  alloy-data:

networks:
  argos:
  # Alloy ↔ docker-proxy 전용. internal: 외부(인터넷·호스트 밖)로 나가는 경로가 없다.
  dockerapi:
    internal: true
