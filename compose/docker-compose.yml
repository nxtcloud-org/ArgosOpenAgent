# ArgosOpen Agent — Alloy 모니터링 에이전트
#
# ── 이미지 버전 고정 (2026-08-16 기준 최신 정식 릴리스) ──
# latest 를 쓰면 노드마다 다른 버전이 깔린다. 오늘 A노드, 2주 뒤 B노드에 설치하면
# Alloy 버전이 달라져 수집 항목·라벨이 미묘하게 어긋날 수 있다.
# 업그레이드는 이 파일을 고쳐 명시적인 커밋으로 남긴다.
#
# 이 파일이 유일한 정답(single source of truth)이다. init 이 이 파일을 그대로
# 복사해 설치 경로에 놓는다 — 스크립트 안에 사본을 만들지 않는다.
# 컨테이너 구성을 바꾸려면 여기만 고치면 된다.
#
# 런타임 값(MIMIR_ENDPOINT/LOKI_ENDPOINT/INSTANCE_ID/NODE_NAME)은 같은 디렉토리의
# .env 에서 주입된다. 설정 파일 자체는 모든 노드에서 동일하게 유지한다.
services:
  alloy:
    image: grafana/alloy:v1.18.0
    container_name: argos-alloy
    restart: unless-stopped
    # cAdvisor가 "다른" 컨테이너의 cgroup을 보려면 호스트 cgroup 네임스페이스가 필요하다.
    # cgroup v2(AL2023 등)에서 Docker 기본값은 cgroupns=private이라, 이 설정이 없으면
    # Alloy는 자기 자신의 cgroup만 보게 되어 컨테이너 메트릭이 전부 비어 나온다.
    cgroup: host
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      MIMIR_ENDPOINT: ${MIMIR_ENDPOINT}
      LOKI_ENDPOINT: ${LOKI_ENDPOINT}
      INSTANCE_ID: ${INSTANCE_ID}
      NODE_NAME: ${NODE_NAME}
    ports: ["12345:12345"]        # Alloy UI (필요시)
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # 메트릭: 호스트 OS
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # 메트릭(cadvisor) + 로그(컨테이너): 도커 소켓
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 메트릭: node_exporter diskstats 의 udev 장치 메타데이터 (없으면 error 로그)
      - /run/udev:/run/udev:ro
      # 메트릭(cadvisor): node_exporter와 달리 아래는 "기본 경로 그대로" 읽는다.
      # 빠지면 컨테이너 메트릭이 전부 비어 나온다.
      # (/rootfs 는 config.alloy 의 rootfs_path 로도 쓰인다 — 디스크 사용량 정확도)
      - /:/rootfs:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # 로그: systemd journald (시스템/서비스 로그)
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:12345/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "autoheal=true"
    networks: [argos]

  # 헬스체크 실패 시 자동 재시작.
  # restart: unless-stopped 는 "프로세스가 죽었을 때"만 살린다. Alloy 가 살아는
  # 있지만 수집이 멈춘 상태(=healthcheck 실패)는 못 잡으므로 별도로 둔다.
  autoheal:
    # 버전 태그가 2021년 1.2.0 에서 멈춰 있고 latest 는 계속 갱신된다(사실상 main).
    # 그래서 태그가 아니라 digest 로 굳혀 "지금 돌고 있는 내용"을 그대로 고정한다.
    # 이 digest = 2026-08-17 시점의 latest.  1.2.0 태그를 쓰면 5년 전 릴리스로 내려간다.
    image: willfarrell/autoheal@sha256:b9b7a5e7803dad0aa12b0ffd05aece796f1ea0ac65595705da847d3438121112
    container_name: argos-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [argos]

volumes:
  alloy-data:

networks:
  argos:
